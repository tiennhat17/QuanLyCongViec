spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:taskmanager;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
